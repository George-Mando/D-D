                        < script>
                        'use strict';

                    /* ═══════════════════════════════════════════════════════
                       WAKE LOCK — Keep screen on during play
                    ═══════════════════════════════════════════════════════ */
                    let wakeLock = null;
                    async function requestWakeLock() {
                        try {
                            if ('wakeLock' in navigator) {
                                wakeLock = await navigator.wakeLock.request('screen');
                                const badge = document.getElementById('wake-lock-badge');
                                badge.style.opacity = '1';
                                setTimeout(() = > { badge.style.opacity = '0'; }, 3000);
                                wakeLock.addEventListener('release', () = > { wakeLock = null; });
                            }
                        }
                        catch (e) { console.log('Wake lock not available:', e.message); }
                    }
                    document.addEventListener('visibilitychange', async() = > {
                        if (wakeLock != = null && document.visibilityState == = 'visible') {
                            await requestWakeLock();
                        }
                    });

                    /* ═══════════════════════════════════════════════════════
                       PARTY SYSTEM — MQTT
                    ═══════════════════════════════════════════════════════ */
                    let mqttClient = null, mqttConnected = false, partyCode = null, partyRole = null;
                    let myPartyName = '', partyMembers = {};
                    const MQTT_BROKER = 'wss://broker.hivemq.com:8884/mqtt';

                    function mqttTopic(suffix) { return 'dm-oracle-v45/' + partyCode + '/' + suffix; }

                    function mqttConnect(onConnected) {
                        const clientId = 'dmo_' + Math.random().toString(36).substr(2, 9);
                        try {
                            mqttClient = mqtt.connect(MQTT_BROKER, { clientId, clean: true, connectTimeout : 8000, reconnectPeriod : 3000, keepalive : 30 });
                        }
                        catch (e) { setWsStatus('error', '⚠ Could not connect'); return; }
                        mqttClient.on('connect', () = > {
                            mqttConnected = true;
                            setWsStatus('connected', '✓ CONNECTED — REALM ONLINE');
                            if (onConnected) onConnected();
                        });
                        mqttClient.on('error', () = > { setWsStatus('error', '⚠ ERROR — Retrying...'); });
                        mqttClient.on('reconnect', () = > { setWsStatus('connecting', '⏳ RECONNECTING...'); });
                        mqttClient.on('offline', () = > { mqttConnected = false; setWsStatus('error', '⚠ OFFLINE'); });
                        mqttClient.on('message', (topic, message) = > {
                            try { handleMqttMessage(topic, JSON.parse(message.toString())); }
                            catch (e) {}
                        });
                    }

                    function handleMqttMessage(topic, payload) {
                        const parts = topic.split('/'), msgType = parts[2];
                        if (msgType == = 'member') {
                            if (!payload.name) return;
                            partyMembers[payload.name] = { ...payload, lastSeen: Date.now() };
                            renderPartyHUD(); updatePartyTab(); updateHostMemberList();
                        }
                        else if (msgType == = 'leave') {
                            if (payload.name && partyMembers[payload.name]) {
                                partyMembers[payload.name].online = false;
                                renderPartyHUD(); updatePartyTab();
                            }
                        }
                        else if (msgType == = 'ping') {
                            if (payload.name&& payload.name != = myPartyName) {
                                partyMembers[payload.name] = { ...payload, online: true, lastSeen : Date.now() };
                                renderPartyHUD(); updatePartyTab(); updateHostMemberList(); publishMyState();
                            }
                        }
                        else if (msgType == = 'story') {
                            /* ★ STORY SYNC — non-host players receive and display the same story ★ */
                            if (payload.from != = myPartyName) {
                                const tag = `<span class = "story-sync-tag" > 📡 ${ payload.from }< / span>`;
                                    addMsg('ai', tag + payload.dmText);
                                speak(payload.dmText);
                                /* Show sync confirmed badge */
                                const badge = document.getElementById('party-sync-badge');
                                badge.textContent = '✓ STORY SYNCED from ' + payload.from;
                                badge.style.opacity = '1';
                                clearTimeout(badge._t);
                                badge._t = setTimeout(() = > { badge.style.opacity = '0'; }, 4000);
                                sfx_levelup();
                                autoSFXFromText(payload.dmText);
                                parseAndApplyStatChanges(payload.dmText);
                                detectCombatFromText(payload.dmText);
                            }
                        }
                        else if (msgType == = 'roll') {
                            if (payload.name != = myPartyName) {
                                addMsg('ai', `*🎲 ${ payload.name } rolled <strong>${ payload.result }< / strong> on d${ payload.die }${ payload.type ? ' for ' + payload.type : '' }*`);
                            }
                        }
                        else if (msgType == = 'turn') {
                            /* ★ TURN SYSTEM ★ */
                            const myName = myPartyName || localStorage.getItem('dm_char_name') || '';
                            if (payload.forPlayer == = myName) {
                                showRollPrompt(payload.rollType || 'attack', payload.die || 20,
                                    `⚔️ YOUR TURN!Roll d${ payload.die || 20 } to ${ payload.rollType || 'Attack' }`);
                                addMsg('ai', `*⚔️ It's YOUR turn, ${myName}! Hit ROLL NOW!*`);
                                    sfx_levelup();
                            }
                            else {
                                addMsg('ai', `*⚔️ ${ payload.forPlayer }'s turn... waiting...*`);
                            }
                        }
                        else if (msgType == = 'combat_start') {
                            if (payload.enemyName) spawnEnemy(payload.enemyName, payload.enemyHp || 20, []);

                        else if (msgType == = 'stat_sync') {

                    }

                    function subscribeToParty() {
                        if (!mqttClient || !partyCode) return;
                        mqttClient.subscribe(mqttTopic('#'), { qos: 0 });
                    }

                    function publishMyState() {
                        if (!mqttClient || !mqttConnected || !partyCode) return;
                        const state = {
                          name: myPartyName, class : localStorage.getItem('dm_char_class') || 'Adventurer',
                          hp : vitals.hp, maxHp : vitals.maxHp, stamina : vitals.stamina, maxStamina : vitals.maxStamina,
                          online : true, isHost : partyRole == = 'host', lastSeen : Date.now()
                        };
                        partyMembers[myPartyName] = state;
                        mqttClient.publish(mqttTopic('member'), JSON.stringify(state), { qos: 0, retain : true });
                    }

                    function publishPing() {
                        if (!mqttClient || !mqttConnected || !partyCode) return;
                        mqttClient.publish(mqttTopic('ping'), JSON.stringify({
                          name: myPartyName, class : localStorage.getItem('dm_char_class') || 'Adventurer',
                          hp : vitals.hp, maxHp : vitals.maxHp, stamina : vitals.stamina, maxStamina : vitals.maxStamina,
                          online : true, isHost : partyRole == = 'host', lastSeen : Date.now()
                            }), { qos: 0 });
                    }

                    /* Broadcast DM story to all party members */

                        if (!mqttClient || !mqttConnected || !partyCode) return;
                        mqttClient.publish(mqttTopic('story'), JSON.stringify({ from: myPartyName, dmText }), { qos: 0 });
                    }

                    /* Broadcast a roll result */
                    function broadcastRoll(die, result, type) {
                        if (!mqttClient || !mqttConnected || !partyCode) return;
                        mqttClient.publish(mqttTopic('roll'), JSON.stringify({ name: myPartyName, die, result, type }), { qos: 0 });
                    }

                    /* Broadcast whose turn it is */

                    function generateCode() {
                        const c = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';

                        for (let i = 0; i < 6; i++) code += c[Math.floor(Math.random() * c.length)];
                        return code;
                    }

                    function createParty() {
                        const nameEl = document.getElementById('host-name-input');
                        myPartyName = nameEl.value.trim() || localStorage.getItem('dm_char_name') || 'Host';
                        const btn = document.getElementById('create-party-btn');
                        btn.disabled = true; btn.textContent = '⏳ CREATING...';

                            subscribeToParty();

                        });

                        document.getElementById('host-step-active').style.display = 'none';

                    }

                        const list = document.getElementById('host-member-list');
                        if (!list) return;

                            const isOnline = m.online && (Date.now() - (m.lastSeen || 0) < 30000);

                    function broadcastPartyUpdate() {
                        if (!partyCode || !myPartyName || !mqttConnected) return;

                    }

                    function leaveParty() {
                        if (mqttClient && mqttConnected && partyCode) {
                            mqttClient.publish(mqttTopic('leave'), JSON.stringify({ name: myPartyName }), { qos: 0 }, () = > { mqttClient.end(true); });

                    function renderPartyHUD() {

                        inner.innerHTML = members.map(m = > {
                            const hpPct = m.maxHp > 0 ? Math.max(0, Math.min(100, (m.hp / m.maxHp) * 100)) : 100;
                            const stPct = m.maxStamina > 0 ? Math.max(0, Math.min(100, (m.stamina / m.maxStamina) * 100)) : 100;
                            const isMe = m.name == = myPartyName;
                            const isOnline = m.online && (Date.now() - (m.lastSeen || 0) < 30000);
                            return `<div class = "party-member-hud" style = "${isMe?'border-color:rgba(201,168,76,.5);':''}" >

                                <div style = "font-family:'Share Tech Mono',monospace;font-size:6px;color:var(--parch-faint);margin-bottom:2px;">${ m.class || '?' }< / div>

                                <div class = "pmh-bar-row"><span style = "font-size:7px;">❤️< / span><div class = "pmh-bar-track"><div class = "pmh-bar-fill vf-hp" style = "width:${hpPct}%">< / div>< / div><span style = "font-family:'Share Tech Mono',monospace;font-size:6px;color:var(--gold);margin-left:2px;">${ m.hp || 0 }< / span>< / div>
                                <div class = "pmh-bar-row"><span style = "font-size:7px;">⚡< / span><div class = "pmh-bar-track"><div class = "pmh-bar-fill vf-stamina" style = "width:${stPct}%">< / div>< / div>< / div>
                                < / div>< / div>`;

                    function updatePartyTab() {
                        const noParty = document.getElementById('no-party-msg'),
                            partyInfo = document.getElementById('current-party-info'),
                            memberList = document.getElementById('current-member-list'),
                            codeEl = document.getElementById('current-party-code'),
                            members = Object.values(partyMembers);
                        if (!partyCode) { noParty.style.display = 'block'; partyInfo.style.display = 'none'; return; }
                        noParty.style.display = 'none'; partyInfo.style.display = 'block';
                        if (codeEl) codeEl.textContent = partyCode;
                        if (memberList) memberList.innerHTML = members.map(m = > {
                            const isOnline = m.online && (Date.now() - (m.lastSeen || 0) < 30000);
                            return `<div class = "party-member" > <div class = "pm-dot ${isOnline?'online':'offline'}">< / div><div class = "pm-name">${ m.name }${ m.isHost ? ' 👑' : '' }< / div><div class = "pm-class">${ m.class || '?' }< / div><div class = "pm-hp">❤️ ${ m.hp || 0 } / ${ m.maxHp || 0 }< / div>< / div>`;
                        }).join('');
                    }

                    function openPartyModal() { document.getElementById('party-modal').classList.add('show'); updatePartyTab(); }
                    function closePartyModal() { document.getElementById('party-modal').classList.remove('show'); }

                    function switchPartyTab(name) {
                        document.querySelectorAll('.party-tab-btn').forEach((b, i) = > b.classList.toggle('active', ['host', 'join', 'current'][i] == = name));
                        document.querySelectorAll('.party-tab').forEach((t, i) = > t.classList.toggle('active', ['ptab-host', 'ptab-join', 'ptab-current'][i] == = 'ptab-' + name));
                        if (name == = 'current') updatePartyTab();
                    }

                    /* ═══════════════════════════════════════════════════════
                       COMBAT TURN SYSTEM (D&D style)
                    ═══════════════════════════════════════════════════════ */
                    let combatActive = false, turnOrder = [], currentTurnIdx = 0, combatRound = 1;
                    let pendingRollType = null, pendingRollDie = 20, pendingRollLabel = '';

                    function startCombatTurns(enemyName) {
                        combatActive = true;
                        combatRound = 1;
                        /* Build turn order: all party members + enemy, sorted by initiative (random d20) */
                        const members = partyCode ? Object.values(partyMembers).map(m = > m.name) : [myPartyName || localStorage.getItem('dm_char_name') || 'Hero'] ;
                        const withInitiative = members.map(name = > ({ name, initiative: Math.floor(Math.random() * 20) + 1, isEnemy : false }));
                        withInitiative.push({ name: enemyName, initiative : Math.floor(Math.random() * 20) + 1, isEnemy : true });
                        withInitiative.sort((a, b) = > b.initiative - a.initiative);
                        turnOrder = withInitiative;
                        currentTurnIdx = 0;
                        renderCombatHUD();
                        processTurn();
                        addMsg('ai', `*⚔️ COMBAT BEGINS — Round ${ combatRound }!Initiative: ${ turnOrder.map(t = > t.name + '(' + t.initiative + ')').join(' → ') }*`);
                    }

                    function processTurn() {
                        if (!combatActive || turnOrder.length == = 0) return;
                        const current = turnOrder[currentTurnIdx];
                        renderCombatHUD();
                        if (current.isEnemy) {
                            /* Enemy turn — auto attack after delay */
                            addMsg('ai', `*⚔️ ${ current.name }'s turn...*`);
                                setTimeout(() = > {
                                if (!combatActive) return;
                                const dmg = Math.floor(Math.random() * 8) + 1;
                                addMsg('ai', `*The ${ current.name } strikes!You take ${ dmg } damage!*`);
                                adjustStat('hp', -dmg, true);
                                showStatNotif(`💔 - ${ dmg } HP from ${ current.name }`, 'damage');
                                sfx_damage();
                                broadcastPartyUpdate();
                                setTimeout(() = > advanceTurn(), 1500);
                            }, 1200);
                        }
                        else {
                            const myName = myPartyName || localStorage.getItem('dm_char_name') || '';
                            if (current.name == = myName) {
                                /* My turn */
                                showRollPrompt('Attack', 20, `⚔️ YOUR TURN(Round ${ combatRound }) — Roll d20 to Attack!`);
                                if (partyCode) broadcastTurn(current.name, 'Attack', 20);
                            }
                            else {
                                /* Another player's turn */
                                addMsg('ai', `*⚔️ Waiting for ${ current.name } to act...*`);
                                if (partyCode&& partyRole == = 'host') broadcastTurn(current.name, 'Attack', 20);
                            }
                        }
                    }

                    function advanceTurn() {
                        if (!combatActive) return;
                        currentTurnIdx = (currentTurnIdx + 1) % turnOrder.length;
                        if (currentTurnIdx == = 0) {
                            combatRound++;
                            addMsg('ai', `*⚔️ — Round ${ combatRound } begins — * `);
                        }
                        processTurn();
                    }

                    function endCombat() {
                        combatActive = false; turnOrder = []; currentTurnIdx = 0; combatRound = 1;
                        document.getElementById('combat-hud').classList.remove('active');
                        hideRollPrompt();
                    }

                    function renderCombatHUD() {
                        const hud = document.getElementById('combat-hud');
                        if (!combatActive || turnOrder.length == = 0) { hud.classList.remove('active'); return; }
                        hud.classList.add('active');
                        const myName = myPartyName || localStorage.getItem('dm_char_name') || '';
                        hud.innerHTML = `<span style = "font-family:'Cinzel',serif;font-size:7px;letter-spacing:2px;color:var(--parch-faint);flex-shrink:0;" > ROUND ${ combatRound } ⚔️< / span>` +
                            turnOrder.map((t, i) = > {
                            const isActive = i == = currentTurnIdx;
                            const isMe = t.name == = myName;
                            const cls = isActive ? (t.isEnemy ? 'turn-token enemy-turn' : 'turn-token active-turn') : 'turn-token';
                            return `<div class = "${cls}" > ${ isActive ? '▶ ' : '' }${ t.isEnemy ? '💀' : (isMe ? '⚔️' : '🧙') } ${ t.name }${ isActive ? '' : '' }< / div>`;
                        }).join('');
                    }

                    function showRollPrompt(type, die, label) {
                        pendingRollType = type; pendingRollDie = die; pendingRollLabel = label;
                        document.getElementById('roll-prompt-label').textContent = label;
                        document.getElementById('roll-prompt-bar').classList.add('active');
                        requestWakeLock();
                    }

                    function hideRollPrompt() {
                        document.getElementById('roll-prompt-bar').classList.remove('active');
                        pendingRollType = null;
                    }

                    function executeRollFromPrompt() {
                        if (!pendingRollDie) return;
                        const die = pendingRollDie, type = pendingRollType || 'attack';
                        sfx_roll();
                        openDiceOverlay(`${type.toUpperCase()
                    } ROLL — d${ die }`);
                    animateDice3D(die, (result) = > {
                        let flavor = '', combatMsg = '';
                        if (die == = 20) {
                            if (result == = 20) { flavor = '⭐ CRITICAL HIT!'; sfx_critical(); combatMsg = `You roll a NATURAL 20 — CRITICAL HIT on the ${ currentEnemy ? .name || 'enemy' }!`; if (currentEnemy) { const dmg = (Math.floor(Math.random() * 8) + 1) * 2; damageEnemy(dmg); combatMsg += ` You deal ${ dmg } damage!`; } }
                            else if (result == = 1) { flavor = '💀 CRITICAL FAIL!'; sfx_fail(); combatMsg = 'You roll a 1 — CRITICAL FAILURE! Your attack goes wide!'; }
                            else if (result >= 15) { flavor = '✨ Hit!'; combatMsg = `You roll ${ result } — a solid hit!`; if (currentEnemy) { const dmg = Math.floor(Math.random() * 8) + 1 + 3; damageEnemy(dmg); combatMsg += ` Dealing ${ dmg } damage!`; } }
                            else if (result >= 10) { flavor = '🎲 Hit'; combatMsg = `You roll ${ result } — you connect!`; if (currentEnemy) { const dmg = Math.floor(Math.random() * 6) + 1; damageEnemy(dmg); combatMsg += ` ${ dmg } damage!`; } }
                            else { flavor = '😬 Miss'; combatMsg = `You roll ${ result } — the attack misses!`; }
                        }
                        else {
                            flavor = `d${die
                        }: ${ result }`;
                                combatMsg = `You roll ${ result } on d${ die }.`;
                    }
                    if (combatMsg) setTimeout(() = > { addMsg('ai', `*${ combatMsg }*`); broadcastPartyUpdate(); }, 500);
                    broadcastRoll(die, result, type);
                    hideRollPrompt();
                    /* Advance to next turn after roll */
                    if (combatActive) setTimeout(() = > advanceTurn(), 2000);
  });
}

/* Detect if DM text starts combat */
function detectCombatFromText(text) {
    if (combatActive) return;
    const combatWords = ['attack', 'battle', 'combat', 'fight', 'enemy', 'foe', 'goblin', 'orc', 'dragon', 'vampire', 'skeleton', 'zombie', 'bandit', 'wolf', 'bear', 'troll', 'giant', 'demon', 'devil', 'undead', 'creature', 'monster', 'ghoul', 'wight', 'wraith', 'spider', 'kobold', 'hobgoblin', 'bugbear'];
    const hasCombat = combatWords.some(w = > text.toLowerCase().includes(w));
    if (hasCombat) {
        let enemyName = 'Enemy';
        const creatureNames = ['Goblin', 'Orc', 'Dragon', 'Vampire', 'Skeleton', 'Zombie', 'Bandit', 'Wolf', 'Bear', 'Troll', 'Giant', 'Demon', 'Devil', 'Ghoul', 'Wight', 'Wraith', 'Spider', 'Kobold', 'Hobgoblin', 'Bugbear', 'Gnoll', 'Harpy', 'Orc', 'Cultist'];
        for (const c of creatureNames) { if (text.includes(c)) { enemyName = c; break; } }
        const m = text.match(/ (? : A | An | The)([A - Z][a - z]{ 2,20 })\s + (? : appears ? | emerges ? | charges ? | attacks ? | lunges ? | snarls ? | stands ? ) / );
        if (m) enemyName = m[1];
        let hp = 20;
        if (/ (giant | dragon | troll | demon | devil) / i.test(enemyName)) hp = 70;
        else if (/ (orc | hobgoblin | bugbear) / i.test(enemyName)) hp = 35;
        else if (/ (goblin | skeleton | kobold | zombie) / i.test(enemyName)) hp = 15;
        spawnEnemy(enemyName, hp, []);
        /* Broadcast combat start to party */
        if (mqttClient && mqttConnected && partyCode) {
            mqttClient.publish(mqttTopic('combat_start'), JSON.stringify({ enemyName, enemyHp: hp }), { qos: 0 });
        }
    }
}

function parseAndApplyStatChanges(text) {
    detectCombatFromText(text);
    const dmgPats = [/ you(? : take | suffer | receive | lose) (\d + ) (? : points ? of) ? (? : damage | hp) / gi, / deals ? (\d + ) (? : points ? of) ? damage(? : to) ? you / gi, / (? : strikes ? | hits ? ) you for (\d + ) / gi, / you take(\d + ) (? : piercing | slashing | bludgeoning | fire | cold | lightning | necrotic | radiant | thunder | acid | poison | psychic | force) / gi];
    let dmgApplied = false; for (const pat of dmgPats) { const ms = [...text.matchAll(pat)]; for (const m of ms) { const n = parseInt(m[1]); if (n > 0 && n < 500 && !dmgApplied) { adjustStat('hp', -n, true); adjustStat('stamina', -Math.floor(n * .4), true); showStatNotif('💔 -' + n + ' HP (' + vitals.hp + '/' + vitals.maxHp + ')', 'damage'); sfx_damage(); dmgApplied = true; } } }
    const healPats = [/ you(? : regain | restore | recover | heal | gain) (\d + ) (? : hit points ? | hp) / gi, / heals ? you for (\d + ) / gi, / \ + (\d + ) (? : hp | hit points ? ) / gi];
    let healApplied = false; for (const pat of healPats) { const ms = [...text.matchAll(pat)]; for (const m of ms) { const n = parseInt(m[1]); if (n > 0 && n < 500 && !healApplied) { adjustStat('hp', n, true); showStatNotif('💚 +' + n + ' HP', 'heal'); sfx_heal(); healApplied = true; } } }
    if (vitals.maxMana > 0) { const manaPats = [/ expend(\d + ) (? : mana | spell slot) / gi, / costs ? (\d + ) (? : mana | spell slot) / gi]; for (const pat of manaPats) { const ms = [...text.matchAll(pat)]; for (const m of ms) { const n = parseInt(m[1]); if (n > 0) { adjustStat('mana', -n * 10, true); showStatNotif('🔮 -' + (n * 10) + ' MANA', 'mana'); } } } }
    if (currentEnemy) { const atkPats = [/ you deal(\d + ) (? : points ? of) ? damage / gi, / dealing(\d + ) (? : points ? of) ? damage(? : to | against) / gi, / your(? : attack | strike | blow | spell | sword | weapon) (? : deals ? | hits ? for) (\d + ) / gi]; for (const pat of atkPats) { const ms = [...text.matchAll(pat)]; for (const m of ms) { const n = parseInt(m[1]); if (n > 0)damageEnemy(n); } } }
    if (currentEnemy) { const deathWords = ['falls dead', 'is slain', 'collapses', 'is defeated', 'breathes its last', 'dies', 'has fallen', 'is dead', 'is destroyed', 'crumbles', 'falls to the ground']; if (deathWords.some(w = > text.toLowerCase().includes(w)))damageEnemy(currentEnemy.hp); }
    const goldPats = [/ you(? : find | gain | receive | loot) (\d + ) (? : gold | gp | coins ? ) / gi, / reward(? : ed) ? (? : with) ? (\d + ) (? : gold | gp) / gi]; for (const pat of goldPats) { const ms = [...text.matchAll(pat)]; for (const m of ms) { const n = parseInt(m[1]); if (n > 0) { adjustGold(n); showStatNotif('🪙 +' + n + ' GP', 'heal'); } } }
    if (/ \b(? : long rest | you rest through | you sleep | dawn breaks | morning arrives)\b / i.test(text)) { vitals.hp = vitals.maxHp; vitals.stamina = vitals.maxStamina; if (/ long rest / i.test(text))vitals.mana = vitals.maxMana; saveVitals(); renderVitals(); showStatNotif('✨ FULLY RESTED', 'heal'); sfx_heal(); }
    broadcastPartyUpdate();
}

    - Player deals damage : "you deal X damage to the [enemy]" or "your attack deals X points of damage"

- Critical hits(nat 20) : Double damage, dramatic description.
- Critical fails(nat 1) : Hilarious or painful failure.

VOICE : Second person("You see...", "Before you stands...").Use * italics * for atmosphere.
FORMAT : 3 - 5 sentences.End with a clear player prompt or roll request.
MULTIPLAYER : Address each party member by name.`;
